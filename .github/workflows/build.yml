name: Build and validate SimpleEconomy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtools-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build downloadable PHAR
    runs-on: ubuntu-24.04

    steps:
      - name: Check out SimpleEconomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned SimpleEconomyExample consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhanAZ-Plugins/SimpleEconomyExample
          ref: 167062652db3f1fb99ecf368767975e43be9fa55
          path: .devtools-dependencies/SimpleEconomyExample
          persist-credentials: false

      - name: Check out SimpleSQL virion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhanAZ-Libraries/SimpleSQL
          ref: 1dba602e54ec6975da9fae1a68824ea061f2f489 # SimpleSQL v1.0.1
          path: virions/SimpleSQL
          persist-credentials: false

      - name: Check out libasynql source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: poggit/libasynql
          ref: 270f8ae93e3271206eadd42ca81862ab9a54f322
          path: .devtools-dependencies/libasynql
          persist-credentials: false

      - name: Check out ScoreHud API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ifera/ScoreHud
          ref: 3f5b13b3daef0de3d2f5f81ad899dbbcc9eaf52f
          path: .devtools-dependencies/ScoreHud
          persist-credentials: false

      - name: Check out Axolotl-PM server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955 # Axolotl-PM 5.49.1
          path: .devtools-servers/axolotl
          persist-credentials: false

      - name: Check out Axolotl-PM PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Prepare libasynql virion
        shell: bash
        run: |
          set -euo pipefail
          git -C .devtools-dependencies/libasynql apply --check "$GITHUB_WORKSPACE/.github/patches/libasynql-devtools-compat.patch"
          git -C .devtools-dependencies/libasynql apply "$GITHUB_WORKSPACE/.github/patches/libasynql-devtools-compat.patch"
          mkdir -p virions/libasynql
          cp -R .devtools-dependencies/libasynql/libasynql/. virions/libasynql/
          cp .devtools-dependencies/libasynql/LICENSE virions/libasynql/LICENSE

      - name: Set up Axolotl-PM PHP with Node 24
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node .devtools-dependencies/setup-php-action/dist/index.js

      - name: Check balance input and arithmetic boundaries
        run: php tests/balance-amount.php

      - name: Analyze plugin and build PHAR with DevTools
        id: build
        uses: NhanAZ/DevTools@6606444fc32787a3e50275fdb668c2310e899740 # v1.0.3
        with:
          project: .
          virions: virions
          output: build
          phpstan: "max"
          phpstan-server: .devtools-servers/axolotl
          phpstan-paths: .devtools-dependencies/ScoreHud/src

      - name: Verify build output
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          php .github/scripts/verify-phar.php "$PHAR_PATH" "$BUILD_METADATA"
          cp "$BUILD_METADATA" build/build-metadata.json

      - name: Analyze and build pinned example consumer
        id: example
        uses: NhanAZ/DevTools@6606444fc32787a3e50275fdb668c2310e899740 # v1.0.3
        with:
          project: .devtools-dependencies/SimpleEconomyExample
          output: build-example
          phpstan: "max"
          phpstan-server: .devtools-servers/axolotl
          phpstan-paths: |
            src
            virions/SimpleSQL/src
            .devtools-dependencies/libasynql/libasynql/src
            .devtools-dependencies/ScoreHud/src

      - name: Verify example PHAR checksum
        shell: bash
        env:
          EXAMPLE_PHAR: ${{ steps.example.outputs.phar }}
          EXAMPLE_SHA256: ${{ steps.example.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$EXAMPLE_PHAR" | cut -d ' ' -f 1)" = "$EXAMPLE_SHA256"

      - name: Download and verify pinned Axolotl-PM runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/axolotl-pm/PocketMine-MP/releases/download/5.49.1/PocketMine-MP.phar \
            --output "$RUNNER_TEMP/PocketMine-MP.phar"
          printf '%s  %s\n' \
            'b62ce263c079a00498a49cd3eab0bfa454f4ba195e5f9d62e32927cfc805c665' \
            "$RUNNER_TEMP/PocketMine-MP.phar" | sha256sum --check

      - name: Smoke test balance persistence and example commands
        env:
          SERVER_PHAR: ${{ runner.temp }}/PocketMine-MP.phar
          PLUGIN_PHAR: ${{ steps.build.outputs.phar }}
          EXAMPLE_PHAR: ${{ steps.example.outputs.phar }}
        run: python3 .github/scripts/runtime-smoke.py

      - name: Upload PHAR from this commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.plugin-name }}-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/build-metadata.json
          if-no-files-found: error
          retention-days: 14
