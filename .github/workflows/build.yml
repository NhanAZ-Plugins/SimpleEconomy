name: DevTools Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtools-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build downloadable PHAR
    runs-on: ubuntu-24.04

    steps:
      - name: Check out SimpleEconomy
        uses: actions/checkout@v7.0.1

      - name: Check out SimpleSQL virion
        uses: actions/checkout@v7.0.1
        with:
          repository: NhanAZ-Libraries/SimpleSQL
          ref: 8586047e349039e017cdc5efce7e6714a903daad
          path: virions/SimpleSQL
          persist-credentials: false

      - name: Check out libasynql source
        uses: actions/checkout@v7.0.1
        with:
          repository: poggit/libasynql
          ref: 270f8ae93e3271206eadd42ca81862ab9a54f322
          path: .devtools-dependencies/libasynql
          persist-credentials: false

      - name: Prepare libasynql virion
        shell: bash
        run: |
          set -euo pipefail
          git -C .devtools-dependencies/libasynql apply --check "$GITHUB_WORKSPACE/.github/patches/libasynql-devtools-compat.patch"
          git -C .devtools-dependencies/libasynql apply "$GITHUB_WORKSPACE/.github/patches/libasynql-devtools-compat.patch"
          mkdir -p virions/libasynql
          cp -R .devtools-dependencies/libasynql/libasynql/. virions/libasynql/
          cp .devtools-dependencies/libasynql/LICENSE virions/libasynql/LICENSE

      - name: Set up build PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.1"
          extensions: yaml
          ini-values: phar.readonly=0
          coverage: none
          tools: composer:v2

      - name: Build standalone PHAR with DevTools
        id: build
        uses: NhanAZ/DevTools@v0.1.0
        env:
          COMPOSER_NO_DEV: "1"
        with:
          project: .
          virions: virions
          output: build

      - name: Verify build output
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
        run: test -s "$PHAR_PATH"

      - name: Upload PHAR from this commit
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build.outputs.plugin-name }}-${{ github.sha }}
          path: ${{ steps.build.outputs.phar }}
          if-no-files-found: error
          retention-days: 14
