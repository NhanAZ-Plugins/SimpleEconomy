# Copy into the plugin repository. Hub replaces SimpleEconomy on installation.
name: BedrockNexus Publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP for Axolotl-PM 5
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e # 1.0.0
        with:
          php-version: '8.4'
          install-path: ../bin
          pm-version-major: '5'

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Build with DevTools
        id: build
        uses: NhanAZ/DevTools@8b7db655845dc5d9e5e51b26a5d0815d5f7e5323 # v2.1.1
        with:
          project: .
          virions: .devtools-virions
          output: build
          prepare-dependencies: 'true'

      - name: Stage the plugin file
        env:
          SOURCE_PHAR: ${{ steps.build.outputs.phar }}
          OUTPUT_PHAR: 'dist/SimpleEconomy.phar'
        run: |
          mkdir -p dist
          cp -- "$SOURCE_PHAR" "$OUTPUT_PHAR"

      - name: Upload plugin for build selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: 'dist/SimpleEconomy.phar'
          if-no-files-found: error
