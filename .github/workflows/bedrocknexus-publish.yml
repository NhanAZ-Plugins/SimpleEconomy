# Copy into the plugin repository. Hub replaces SimpleEconomy on installation.
name: BedrockNexus Publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP for Axolotl-PM 5
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e # 1.0.0
        with:
          php-version: '8.4'
          install-path: ../bin
          pm-version-major: '5'

      - name: Check out SimpleSQL virion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhanAZ-Libraries/SimpleSQL
          ref: 4a9a5b1a25a75776053a35b7c400d34e95c1becd # SimpleSQL v1.1.1 source
          path: .devtools-dependencies/SimpleSQL
          persist-credentials: false

      - name: Stage SimpleSQL virion source
        run: |
          set -euo pipefail
          mkdir -p virions/SimpleSQL
          cp -R .devtools-dependencies/SimpleSQL/src virions/SimpleSQL/src
          cp .devtools-dependencies/SimpleSQL/virion.yml virions/SimpleSQL/virion.yml
          cp .devtools-dependencies/SimpleSQL/LICENSE virions/SimpleSQL/LICENSE

      - name: Check out libasynql virion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: poggit/libasynql
          ref: 270f8ae93e3271206eadd42ca81862ab9a54f322
          path: .devtools-dependencies/libasynql
          persist-credentials: false

      - name: Prepare libasynql virion
        run: |
          set -euo pipefail
          git -C .devtools-dependencies/libasynql apply --check "$GITHUB_WORKSPACE/.github/patches/libasynql-devtools-compat.patch"
          git -C .devtools-dependencies/libasynql apply "$GITHUB_WORKSPACE/.github/patches/libasynql-devtools-compat.patch"
          git -C .devtools-dependencies/libasynql apply --unidiff-zero --check "$GITHUB_WORKSPACE/.github/patches/libasynql-php84-nullability.patch"
          git -C .devtools-dependencies/libasynql apply --unidiff-zero "$GITHUB_WORKSPACE/.github/patches/libasynql-php84-nullability.patch"
          mkdir -p virions/libasynql
          cp -R .devtools-dependencies/libasynql/libasynql/. virions/libasynql/
          cp .devtools-dependencies/libasynql/LICENSE virions/libasynql/LICENSE

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Build with DevTools
        id: build
        uses: NhanAZ/DevTools@3f5752b32da49bfd1e5c28bad304d110a42f76ff # v2.0.2
        with:
          project: .
          output: build
          prepare-dependencies: 'false'

      - name: Stage the plugin file
        env:
          SOURCE_PHAR: ${{ steps.build.outputs.phar }}
          OUTPUT_PHAR: 'dist/SimpleEconomy.phar'
        run: |
          mkdir -p dist
          cp -- "$SOURCE_PHAR" "$OUTPUT_PHAR"

      - name: Upload plugin for build selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: 'dist/SimpleEconomy.phar'
          if-no-files-found: error
